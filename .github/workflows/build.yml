# Builds T150 Synth for Windows and Mac on GitHub's machines.
#
# - Every push: builds both, runs the DSP tests, and keeps the zips as
#   downloadable "artifacts" on the Actions tab (good for checking it works).
# - Push a version tag (e.g. v0.1.0) or publish a release on the website:
#   also attaches the Windows and Mac zips to that GitHub Release.

name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ published ]   # "Publish release" on the website also triggers a build
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: Mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      # ---------- Windows package ----------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "build/T150Synth_artefacts/Release"
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item -Recurse "$out/VST3/T150 Synth.vst3" stage/
          Copy-Item "$out/Standalone/T150 Synth.exe" stage/
          Copy-Item packaging/README-Windows.txt stage/README.txt
          Compress-Archive -Path stage/* -DestinationPath "T150-Synth-Windows.zip"

      # ---------- Mac package ----------
      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          out="build/T150Synth_artefacts/Release"
          mkdir -p "stage/T150 Synth"
          cp -R "$out/VST3/T150 Synth.vst3"      "stage/T150 Synth/"
          cp -R "$out/AU/T150 Synth.component"   "stage/T150 Synth/"
          cp -R "$out/Standalone/T150 Synth.app" "stage/T150 Synth/"
          cp packaging/README-Mac.txt        "stage/T150 Synth/README.txt"
          cp packaging/install-mac.command   "stage/T150 Synth/Install.command"
          chmod +x "stage/T150 Synth/Install.command"
          # "Ad-hoc" signing: free, required for Apple Silicon. It is not the paid
          # Apple signing, so macOS still asks the user to approve it once.
          codesign --force --deep --sign - "stage/T150 Synth/T150 Synth.vst3"
          codesign --force --deep --sign - "stage/T150 Synth/T150 Synth.component"
          codesign --force --deep --sign - "stage/T150 Synth/T150 Synth.app"
          # ditto keeps the app bundles intact (plain zip can break them).
          ditto -c -k --sequesterRsrc --keepParent "stage/T150 Synth" "T150-Synth-Mac.zip"

      - name: Keep the zip (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: T150-Synth-${{ matrix.name }}
          path: T150-Synth-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect the zips
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the Release (or add the zips to an existing one)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          overwrite_files: true
